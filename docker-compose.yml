services:
  scheduler:
    build: .
    image: observatory-scheduler:latest
    container_name: observatory-scheduler
    ports:
      - "8080:8080"
    environment:
      # 容器内监听端口（左侧宿主机端口可自行修改）
      PORT: "8080"
      DB_PATH: /app/data/scheduler.db
    volumes:
      - scheduler-data:/app/data
    restart: unless-stopped

volumes:
  scheduler-data:
